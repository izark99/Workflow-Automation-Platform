<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Data Flow</title>
    <!-- The icon of the app, inline so that no request is made for it. -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231d5fd1'/%3E%3Cg transform='translate(4 4)' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='3' y='3' width='8' height='8' rx='2'/%3E%3Cpath d='M7 11v4a2 2 0 0 0 2 2h4'/%3E%3Crect x='13' y='13' width='8' height='8' rx='2'/%3E%3C/g%3E%3C/svg%3E" />
    <script>
      // Sets the theme before the first paint (docs/DESIGN.md, Theme rules). Keep in step with src/ui/theme.ts.
      (function () {
        var c = 'system';
        try {
          var v = localStorage.getItem('dfw.theme');
          if (v === 'light' || v === 'dark') c = v;
        } catch (e) {}
        // System is dark unless the browser prefers light, so a browser with no preference gets dark.
        var t = c === 'system' ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : c;
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.style.colorScheme = t;
      })();
    </script>
    <script>
      // Sets the collapsed panels before the first paint. Keep in step with src/ui/panels/panel-state.ts.
      (function () {
        try {
          var v = JSON.parse(localStorage.getItem('dfw.panels') || 'null');
          if (!v || typeof v !== 'object' || Array.isArray(v)) return;
          ['sidebar', 'steps', 'settings', 'refList'].forEach(function (id) {
            if (v[id] === true) document.documentElement.setAttribute('data-panel-' + id, 'collapsed');
          });
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
