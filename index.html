<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Data Flow</title>
    <script>
      // Sets the theme before the first paint (docs/DESIGN.md, Theme rules). Keep in step with src/ui/theme.ts.
      (function () {
        var c = 'system';
        try {
          var v = localStorage.getItem('dfw.theme');
          if (v === 'light' || v === 'dark') c = v;
        } catch (e) {}
        // System is dark unless the browser prefers light, so a browser with no preference gets dark.
        var t = c === 'system' ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : c;
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.style.colorScheme = t;
      })();
    </script>
    <script>
      // Sets the collapsed panels before the first paint. Keep in step with src/ui/panels/panel-state.ts.
      (function () {
        try {
          var v = JSON.parse(localStorage.getItem('dfw.panels') || 'null');
          if (!v || typeof v !== 'object' || Array.isArray(v)) return;
          ['sidebar', 'steps', 'settings', 'refList'].forEach(function (id) {
            if (v[id] === true) document.documentElement.setAttribute('data-panel-' + id, 'collapsed');
          });
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
